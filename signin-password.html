<!DOCTYPE html>

<html>

<head>

    <title>Sign in</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="form-Wrapper">
        <div class="container">
            <div class="form-Wrapper__top --welcome">
                <span class="form-Wrapper-top-welcome">Welcome</span>
                <span class="form-Wrapper-top-email"></span>
                <span class="form-Wrapper-ari-people ari-people"></span>
            </div>

            <form class="form-Wrapper__form --password">
                <label class="form-Wrapper__label --justify" for="password">password <span><a
                            href="#">forgot?</a></span></label>
                <input class="form-Wrapper__input" id="password" name="password" type="password" required>

                <div class="form-Wrapper__not-email">
                    <p>Please enter an email</p>
                </div>
                <div class="form-Wrapper__message">
                    <p>Please enter your password</p>
                </div>
            </form>

            <div class="form-Wrapper__button">
                <button class="button-sumbit" type="sumbit" name="email">Sign in</button>
            </div>

            <form class="form-Wrapper__pravicy --small">
                <input id="pravicy" name="pravicy" type="checkbox" required>
                <label for="pravicy">Stay signed in</label>
            </form>
        </div>
    </div>

    <div class="footer-form">
        <p>Your account for everything Autodesk</p>
        <a class="form__link" href="#">Learn more</a>
    </div>

    <script src="./js/signin-login.js" type="module"></script>

</body>

</html>

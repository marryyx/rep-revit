<!DOCTYPE html>

<html>

<head>

    <title>Sign in</title>
    <link rel="stylesheet" href="../../../styles/style.css">

    <link rel="icon" href="https://damassets.autodesk.net/content/dam/autodesk/logos/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="container">
        <section class="auth">
            <div class="auth__main">
                <div class="auth__top">
                    <p>Sign in</p>
                    <div class="auth__logo"></div>
                </div>

                <form>
                    <div class="input">
                        <label>Email</label>
                        <input id="email" placeholder="name@example.com" type="email" name="email" required>

                        <span class="input__message">
                            <p>This email or username is not recognized</p>
                        </span>
                    </div>

                    <div class="gm-hide" data-target-password>
                        <div class="input">
                            <label>password</label>
                            <input id="password" type="password" minlength="8" name="Password">
                        </div>
                    </div>

                    <div class="auth__bottom">
                        <button id="submit" class="button --sumbit" type="sumbit">Next</button>
                        <p>New to autodesk?
                            <a class="form__link" href="../pages/create-account.html">Create account</a>
                        </p>
                    </div>
                </form>
            </div>

            <include src="components/auth-footer.html"></include>
        </section>
    </div>

    <script src="../../../js/signin.js" type="module"></script>

</body>

</html>

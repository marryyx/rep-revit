<!DOCTYPE html>

<html>

<include src="core/heading.html" locals='{"titlePage": Autodesk - Create Account}'>
</include>

<body>

    <div class="container">
        <section class="auth">
            <div class="auth__main">
                <div class="auth__top">
                    <p>Create account</p>
                    <div class="auth__logo"></div>
                </div>

                <form>
                    <div class="form__group">
                        <div class="input">
                            <label>First name</label>
                            <input id="usernameFirst" name="FirstName" type="text" pattern="^[A-Za-zА-Яа-яёЁ\s\-]+$"
                                required>
                        </div>

                        <div class="input">
                            <label>Last name</label>
                            <input class="auth__input" id="usernameLast" name="LastName" type="text"
                                pattern="^[A-Za-zА-Яа-яёЁ\s\-]+$" required>
                        </div>
                    </div>

                    <div class="input">
                        <label>Email</label>
                        <input id="email" type="email" name="Email" required>
                    </div>

                    <div class="input">
                        <label>Confirm email</label>
                        <input id="confirmEmail" type="email" name="ConfirmEmail" required>
                    </div>

                    <div class="input">
                        <label>password</label>
                        <input id="password" type="password" minlength="8" name="Password" required>
                    </div>

                    <div class="input --checkbox">
                        <input id="check-pravicy" name="check-pravicy" type="checkbox">
                        <label for="check-pravicy">
                            I agree to the <a class="form__link" href="#">Autodesk Terms of Use</a>and
                            acknowledge the <a class="form__link" href="#">Privacy Statement.</a>
                        </label>
                    </div>

                    <div class="auth__bottom">
                        <button id="submit" class="button --sumbit" type="sumbit">Next</button>
                        <p>Already have an account?
                            <a class="form__link" href="../pages/signin.html">Sign In</a>
                        </p>
                    </div>
                </form>
            </div>

            <include src="components/auth-footer.html"></include>
        </section>
    </div>

    <script src="../../js/register.js" type="module"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<include src="core/heading.html" locals='{"titlePage": My profile}'>
</include>

<body>

    <include src="components/header.html" locals='{
    "headerBasket": false,
    "headerLang": false,
    "headerBurger": true}'>
    </include>

    <div class="profile-container">
        <include src="components/profile-aside.html"></include>

        <section class="profile-main">
            <div class="profile-main__container">

                <div class="profile-main__content --personal">
                    <include src="components/personal-card.html"></include>
                </div>

                <div class="profile-form gm-hide">
                    <button class="button --close --bold --flow" data-close-modal-window></button>

                    <section class="profile-form__section gm-hide" data-target-dialog="personal_info">
                        <header class="profile-form__top">Name</header>

                        <form>
                            <div class="profile-form__desc">Enter the name you go by professionally.</div>

                            <div class="input">
                                <label>First name</label>
                                <input type="text">
                            </div>

                            <div class="input">
                                <label>Last name</label>
                                <input type="text">
                            </div>

                            <div class="profile-form__buttons">
                                <button class="button --dark" sumbit>Save</button>
                                <button class="button --light">Cancel</button>
                            </div>
                        </form>
                    </section>

                    <section class="profile-form__section gm-hide" data-target-dialog="personal_photo">
                        <header class="profile-form__top">Photo</header>

                        <form>
                            <div class="profile-form__desc">Personalize your account and help others recognize you.
                            </div>

                            <div class="profile-form__avatar-changer">
                                <figure class="avatar --96">
                                    <img src="https://avatar.iran.liara.run/public/40">
                                    <figcaption>ML</figcaption>
                                </figure>

                                <button class="button --icon-small --add --flow"></button>
                            </div>

                            <div class="profile-form__desc --center">Accepted formats: .jpg, .png, .gif, .bmp
                                Maximum size: 5MB</div>

                            <div class="profile-form__buttons">
                                <button class="button --dark" sumbit>Upload a photo</button>
                                <button class="button --light">Cancel</button>
                            </div>
                        </form>
                    </section>

                    <section class="profile-form__section gm-hide" data-target-dialog="personal_about">
                        <header class="profile-form__top">About me</header>

                        <form>
                            <div class="profile-form__desc">Share your story and build connections.</div>

                            <div class="profile-form__about-panel">
                                <textarea maxlength="2000"></textarea>
                                <p class="profile-form__counter-symbol"><span>0</span>/2000</p>
                            </div>

                            <div class="profile-form__buttons">
                                <button class="button --dark" sumbit>Save</button>
                                <button class="button --light">Cancel</button>
                            </div>
                        </form>
                    </section>
                </div>
            </div>

            <include src="components/profile-footer.html"></include>
        </section>
    </div>

    <include src="core/script.html"></include>

    <!-- <script src="../../js/personal.js" type="module"></script>
    <script src="../../js/aside-profile.js" type="module"></script>
    <script src="../../js/profile.js" type="module"></script> -->

</body>

</html>

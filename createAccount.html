<!DOCTYPE html>

<html>

<head>

    <title>Autodesk - Create Account</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="form-Wrapper">
        <div class="container">
            <div class="form-Wrapper__top">
                <p>Create account</p>
                <div class="form-Wrapper__logo"></div>
            </div>

            <form class="form-Wrapper__full-name">
                <label class="form-Wrapper__label" for="FirstName">First name</label>
                <label class="form-Wrapper__label" for="LastName">Last name</label>

                <input class="form-Wrapper__input --full-name" id="usernameFirst" name="FirstName" type="text" required>
                <input class="form-Wrapper__input --full-name" id="usernameLast" name="LastName" type="text" required>
            </form>

            <form class="form-Wrapper__form --email">
                <label class="form-Wrapper__label" for="email">Email</label>
                <input class="form-Wrapper__input" id="email" name="email" type="email" required>
            </form>

            <form class="form-Wrapper__form --confirm-email">
                <label class="form-Wrapper__label" for="confirmEmail">Confirm email</label>
                <input class="form-Wrapper__input" id="confirmEmail" name="confirmEmail" type="email" required>
            </form>

            <form class="form-Wrapper__form --password">
                <label class="form-Wrapper__label" for="password">password</label>
                <input class="form-Wrapper__input" id="password" name="password" type="password" required>
            </form>

            <form class="form-Wrapper__pravicy">
                <input id="username" name="pravicy" type="checkbox" required>
                <label for="pravicy">I agree to the <a class="form__link" href="#">Autodesk Terms of Use</a> and
                    acknowledge the <a class="form__link" href="#">Privacy Statement.</a></label>
            </form>

            <div class="form-Wrapper__button">
                <button type="submit">Create account</button>
            </div>

            <div class="form-Wrapper__bottom">
                <p>Already have an account?</p>
                <a class="form__link" href="signin.html">Sign in</a>
            </div>
        </div>
    </div>

    <div class="footer-form">
        <p>Your account for everything Autodesk</p>
        <a class="form__link" href="#">Learn more</a>
    </div>

    <script src="./js/index.js" type="module"></script>

</body>

</html>

<!DOCTYPE html>

<html>

<head>

    <title>Autodesk - Create Account</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="container">
        <section class="auth">
            <div class="auth__main">
                <div class="auth__top">
                    <p>Create account</p>
                    <div class="auth__logo"></div>
                </div>

                <form action="">
                    <div class="input --full-name">
                        <label>First name</label>
                        <label>Last name</label>

                        <input id="usernameFirst" name="FirstName" type="text"
                            pattern="^[A-Za-zА-Яа-яёЁ\s\-]+$" required>
                        <input class="auth__input" id="usernameLast" name="LastName" type="text"
                            pattern="^[A-Za-zА-Яа-яёЁ\s\-]+$" required>
                    </div>

                    <div class="input">
                        <label>Email</label>
                        <input id="email" type="email" required>
                    </div>

                    <div class="input">
                        <label>Confirm email</label>
                        <input id="confirmEmail" type="email" required>
                    </div>

                    <div class="input">
                        <label>password</label>
                        <input id="password" type="password" minlength="8" required>
                    </div>

                    <div class="input__privacy">
                        <input id="pravicy" type="checkbox" required>
                        <label>I agree to the <a class="form__link" href="#">Autodesk Terms of Use</a> and
                            acknowledge the <a class="form__link" href="#">Privacy Statement.</a></label>
                    </div>

                    <div class="auth__button">
                        <button id="submit" class="button --sumbit" type="submit">Create account</button>
                    </div>

                    <div class="auth__bottom">
                        <p>Already have an account?</p>
                        <a class="form__link" href="signin.html">Sign in</a>
                    </div>
                </form>
            </div>

            <footer class="auth__footer">
                <p>Your account for everything Autodesk</p>
                <a class="form__link" href="#">Learn more</a>
            </footer>
        </section>
    </div>

    <script src="./js/register.js" type="module"></script>

</body>

</html>

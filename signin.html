<!DOCTYPE html>

    <title>Sign in</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="container">
        <section class="auth">
            <div class="auth__main">
                <div class="auth__top">
                    <p>Sign in</p>
                    <div class="auth__logo"></div>
                </div>

                <form>
                    <div class="input --signin">
                        <label>Email</label>
                        <input id="email" placeholder="name@example.com" type="email" name="email" required>

                        <div class="input__not-email">
                        </div>
                        <div class="input__message">
                            <p id="message-1">Please enter an email</p>
                            <p id="message-2">This email or username is not recognized</p>
                        </div>
                    </div>

                    <div class="auth__button">
                        <button id="submit" class="button --sumbit" type="sumbit">Next</button>
                    </div>
                </form>

                <div class="auth__bottom">
                    <p>New to autodesk?</p>
                    <a class="form__link" href="create-account.html">Create account</a>
                </div>
            </div>

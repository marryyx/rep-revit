<!DOCTYPE html>

<html>

<head>

    <title>Sign in</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="form-container">
        <div class="signinWrapper">
            <div class="container">
                <div class="signinWrapper__top">
                    <p>Sign in</p>
                    <div class="signinWrapper__logo"></div>
                </div>

                <form class="signinWrapper__signin">
                    <label for="username">Email</label>
                    <input class="signinWrapper__input" id="username" name="username" placeholder="name@example.com"
                        type="email" pattern="[A-Za-z]+" required>
                </form>

                <div class="signinWrapper__button">
                    <button type="sumbit" name="username">Next</button>
                </div>

                <div class="signinWrapper__bottom">
                    <p>New to autodesk?</p>
                    <a class="sing-in__link" href="createAccount.html">Create account</a>
                </div>
            </div>
        </div>

        <div class="footer-form">
            <p>Your account for everything Autodesk</p>
            <a class="sing-in__link" href="#">Learn more</a>
        </div>
    </div>

    <script src="./js/index.js" type="module"></script>

</body>

</html>

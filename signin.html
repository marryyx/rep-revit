<!DOCTYPE html>

<html>

<head>

    <title>Sign in</title>
    <link rel="stylesheet" href="css/style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <div class="form-Wrapper">
        <div class="container">
            <div class="form-Wrapper__top">
                <p>Sign in</p>
                <div class="form-Wrapper__logo"></div>
            </div>

            <form class="form-Wrapper__signin">
                <label class="form-Wrapper__label" for="username">Email</label>
                <input class="form-Wrapper__input" id="username" name="username" placeholder="name@example.com"
                    type="email" required>
            </form>

            <div class="form-Wrapper__button">
                <button class="button-sumbit" type="sumbit" name="username">Next</button>
            </div>

            <div class="form-Wrapper__bottom">
                <p>New to autodesk?</p>
                <a class="form__link" href="#">Create account</a>
            </div>
        </div>
    </div>

    <div class="footer-form">
        <p>Your account for everything Autodesk</p>
        <a class="form__link" href="#">Learn more</a>
    </div>

    <script src="./js/signin.js" type="module"></script>

</body>

</html>
